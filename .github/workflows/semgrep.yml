# Security scan on incoming PRs to the default branch only (no push trigger).
name: Semgrep

on:
  pull_request:
    branches:
      - upscaleai-202511

jobs:
  semgrep:
    name: Semgrep
    runs-on: ubuntu-latest
    container:
      image: returntocorp/semgrep
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - run: semgrep ci
        env:
          SEMGREP_RULES: p/default
