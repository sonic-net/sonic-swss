# Security scan on PRs targeting upscaleai-202511 only (no push trigger).
name: Semgrep

on:
  pull_request:
    branches:
      - upscaleai-202511

permissions:
  contents: read

jobs:
  semgrep:
    permissions:
      contents: read
    name: Semgrep
    runs-on: ubuntu-latest
    container:
      image: returntocorp/semgrep:1.108.0
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: semgrep ci
        env:
          SEMGREP_RULES: p/default
