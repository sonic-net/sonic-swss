# gate-sonic-swss — self-hosted build + mock tests (sonic-slave + buildimage debs).
name: gate-sonic-swss
on:
  pull_request:
    branches: [upscaleai-202511]
  workflow_dispatch:
    inputs:
      skip_dpkg:
        description: 'Skip dpkg-buildpackage step (faster iteration)'
        required: false
        default: false
        type: boolean

concurrency:
  group: swss-gating-${{ github.event.pull_request.number || github.ref_name || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  swss-build-test:
    uses: ./.github/workflows/swss-tests-common.yml
    with:
      skip_dpkg: ${{ github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && github.event.inputs.skip_dpkg == 'true') }}
      swss_common_ref: 'upscaleai-202511'
    secrets: inherit

  gate-report:
    runs-on: ubuntu-22.04
    needs: [swss-build-test]
    if: always() && github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          sparse-checkout: .github/actions/sticky-gate-comment
          sparse-checkout-cone-mode: false

      - name: Download coverage artifacts
        uses: actions/download-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        continue-on-error: true
        with:
          pattern: swss-coverage-*
          merge-multiple: true

      - name: Build PR comment
        env:
          BUILD_RESULT: ${{ needs.swss-build-test.result }}
        run: |
          python3 <<'PY'
          import os
          from pathlib import Path

          result = os.environ["BUILD_RESULT"]
          icon = {"success": "✅", "failure": "❌", "cancelled": "⚠️", "skipped": "⏭️"}

          lines = [
              "## gate-sonic-swss",
              "",
              "| Stage | Result |",
              "|-------|--------|",
              f"| Build + mock tests + S3 baseline coverage gate + cargo (self-hosted) | {icon.get(result, result)} {result} |",
              "",
          ]

          cov_md = Path("coverage-gate.md")
          cov_log = Path("coverage-gate.log")
          if cov_md.is_file():
              lines += [cov_md.read_text(errors="replace").strip(), ""]
          elif cov_log.is_file():
              lines += ["### Coverage gate", "", "```log", cov_log.read_text(errors="replace").strip(), "```", ""]

          lines += [
              "_Runs on runner label `sonic-build-202511` with sonic-slave-bookworm and buildimage debs._",
              "",
          ]

          if result == "success":
              lines += ["All gate stages passed.", ""]
          elif result != "skipped":
              lines += [
                  "Self-hosted gate failed. Open the **swss-tests-common / build-and-test** job log for details.",
                  "",
              ]

          Path("gate-report.md").write_text("\n".join(lines))
          PY

      - name: Post gate summary on PR
        uses: ./.github/actions/sticky-gate-comment
        with:
          header: gate-sonic-swss
          path: gate-report.md
