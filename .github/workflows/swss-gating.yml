# gate-sonic-swss — self-hosted build + mock tests (sonic-slave + buildimage debs).
name: gate-sonic-swss
on:
  pull_request:
    branches: [upscaleai-202511]
  workflow_dispatch:
    inputs:
      skip_dpkg:
        description: 'Skip dpkg-buildpackage step (faster iteration)'
        required: false
        default: false
        type: boolean

concurrency:
  group: swss-gating-${{ github.event.pull_request.number || github.ref_name || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - name: Unchecked getPort() lint (UPSW-7294)
        run: python3 .github/scripts/lint_unchecked_getport.py

  swss-build-test:
    uses: ./.github/workflows/swss-tests-common.yml
    with:
      skip_dpkg: ${{ github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && github.event.inputs.skip_dpkg == 'true') }}
      swss_common_ref: 'upscaleai-202511'
    secrets: inherit

  gate-report:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    needs: [swss-build-test]
    if: always() && github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: write
      actions: read
    steps:
      - name: Check out sticky action from trusted PR base
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: _trusted-sticky-action
          sparse-checkout: .github/actions/sticky-gate-comment
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Detect trusted sticky action
        id: trusted_action
        run: |
          if [ -f _trusted-sticky-action/.github/actions/sticky-gate-comment/action.yml ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Download coverage artifacts
        uses: actions/download-artifact@cc203385981b70ca67e1cc392babf9cc229d5806 # v4.1.9
        continue-on-error: true
        with:
          name: swss-coverage-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Build PR comment
        env:
          BUILD_RESULT: ${{ needs.swss-build-test.result }}
        run: |
          python3 <<'PY'
          import os
          from pathlib import Path

          result = os.environ["BUILD_RESULT"]
          icon = {"success": "✅", "failure": "❌", "cancelled": "⚠️", "skipped": "⏭️"}

          lines = [
              "## gate-sonic-swss",
              "",
              "| Stage | Result |",
              "|-------|--------|",
              f"| Build (ai_fabric profile) + mock tests + coverage gate + cargo (self-hosted) | {icon.get(result, result)} {result} |",
              "",
          ]

          cov_md = Path("coverage-gate.md")
          cov_log = Path("coverage-gate.log")
          if cov_md.is_file():
              lines += [cov_md.read_text(errors="replace").strip(), ""]
          elif cov_log.is_file():
              lines += ["### Coverage gate", "", "```log", cov_log.read_text(errors="replace").strip(), "```", ""]

          lines += [
              "_Validates with `SONIC_BUILD_PROFILE=ai_fabric` flags on runner label `sonic-build-202511`._",
              "",
          ]

          if result == "success":
              lines += ["All gate stages passed.", ""]
          elif result != "skipped":
              lines += [
                  "Self-hosted gate failed. Open the **swss-tests-common / build-and-test** job log for details.",
                  "",
              ]

          Path("gate-report.md").write_text("\n".join(lines))
          PY

      - name: Post gate summary on PR
        if: steps.trusted_action.outputs.available == 'true'
        uses: ./_trusted-sticky-action/.github/actions/sticky-gate-comment
        with:
          header: gate-sonic-swss
          path: gate-report.md

      - name: Post gate summary on migration PR
        if: steps.trusted_action.outputs.available != 'true'
        uses: marocchino/sticky-pull-request-comment@773744901bac0e8cbb5a0dc842800d45e9b2b405 # v2.9.4
        with:
          header: gate-sonic-swss
          path: gate-report.md
