# Reusable workflow: build SWSS inside the SONiC slave Docker container,
# run mock tests, build the Rust countersyncd, and optionally produce .deb packages.
#
# The self-hosted runner must have:
#   1. Docker with a sonic-slave-bookworm* image (built by sonic-buildimage CI)
#   2. SONiC dependency .deb files from a prior sonic-buildimage run
#      (located automatically from the buildimage workspace or dpkg cache)
name: swss-tests-common
on:
  workflow_call:
    inputs:
      skip_dpkg:
        description: 'Skip dpkg-buildpackage (faster, still validates compile + mock tests + cargo)'
        required: false
        default: false
        type: boolean
      swss_common_ref:
        description: 'sonic-swss-common branch/ref to build from source (overrides cached deb headers). Leave empty to use cached deb only.'
        required: false
        default: ''
        type: string

jobs:
  build-and-test:
    runs-on: [self-hosted, linux, sonic-build-202511]
    timeout-minutes: 90
    steps:
      - name: Clean workspace (root-owned artifacts from prior builds)
        run: |
          if [ -d "$GITHUB_WORKSPACE" ]; then
            sudo chown -R "$(whoami):$(id -gn)" "$GITHUB_WORKSPACE" 2>/dev/null || true
            sudo rm -rf "$GITHUB_WORKSPACE"/fsroot-* "$GITHUB_WORKSPACE"/fsroot.docker.* 2>/dev/null || true
          fi

      - name: Checkout sonic-swss
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.ref_name }}
          fetch-depth: 1
          persist-credentials: false

      - name: Checkout sonic-swss-common (from source branch)
        if: inputs.swss_common_ref != ''
        uses: actions/checkout@v4
        with:
          repository: upscale-ai-network/sonic-swss-common
          ref: ${{ inputs.swss_common_ref }}
          token: ${{ secrets.PAT_TOKEN }}
          path: sonic-swss-common
          fetch-depth: 1
          persist-credentials: false

      - name: Resolve Docker image
        id: docker
        run: |
          IMAGE=$(docker image ls \
                  --filter 'reference=sonic-slave-bookworm*' \
                  --format '{{.Repository}}:{{.Tag}}' \
                  | grep -v ':<none>$' \
                  | head -1)
          if [ -z "$IMAGE" ]; then
            echo "::error::No sonic-slave-bookworm Docker image found on this runner"
            exit 1
          fi
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"
          echo "Using Docker image: $IMAGE"

      - name: Locate SONiC dependency debs
        id: debs
        run: |
          # Search strategy:
          #   1. Explicit cache paths
          #   2. Buildimage workspace from other runner slots (target/debs/bookworm/)
          #   3. Dpkg cache tarballs (extract debs from .tgz archives)

          # --- Strategy 1: Direct .deb directories ---
          for candidate in \
            "/var/cache/sonic/debs/bookworm" \
            "/var/cache/sonic/artifacts/mellanox/gating/target/debs/bookworm" \
            "/var/cache/sonic/artifacts/mellanox/prod/target/debs/bookworm"; do
            if [ -d "$candidate" ] && ls "$candidate"/libswsscommon-dev_*.deb 1>/dev/null 2>&1; then
              echo "debs_dir=$candidate" >> "$GITHUB_OUTPUT"
              echo "Found debs at: $candidate"
              exit 0
            fi
          done

          # --- Strategy 2: Scan buildimage workspaces on this runner ---
          RUNNER_BASE=$(dirname "$(dirname "$GITHUB_WORKSPACE")")
          echo "Scanning runner workspace base: $RUNNER_BASE"
          for ws in "$RUNNER_BASE"/*/caspian-sonic-buildimage/target/debs/bookworm \
                     /home/*/org-action-runners/actions-runner-*/_work/caspian-sonic-buildimage/caspian-sonic-buildimage/target/debs/bookworm; do
            if [ -d "$ws" ] && ls "$ws"/libswsscommon-dev_*.deb 1>/dev/null 2>&1; then
              echo "debs_dir=$ws" >> "$GITHUB_OUTPUT"
              echo "Found debs at buildimage workspace: $ws"
              exit 0
            fi
          done

          # --- Strategy 3: Extract from dpkg cache tarballs ---
          CACHE_DIR=""
          for c in "/var/cache/sonic/artifacts/mellanox/gating" \
                   "/var/cache/sonic/artifacts/mellanox/prod"; do
            if [ -d "$c" ] && ls "$c"/libswsscommon-dev_*.tgz 2>/dev/null | head -1 | grep -q .; then
              CACHE_DIR="$c"
              break
            fi
          done

          if [ -n "$CACHE_DIR" ]; then
            echo "Extracting debs from dpkg cache at: $CACHE_DIR"
            EXTRACT_DIR="${RUNNER_TEMP}/sonic-debs-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
            rm -rf "$EXTRACT_DIR"
            mkdir -p "$EXTRACT_DIR"

            for pkg in libyang libyang-cpp libyang-dev \
                       libnl-3-200 libnl-3-dev libnl-route-3-200 libnl-route-3-dev \
                       libnl-genl-3-200 libnl-genl-3-dev libnl-nf-3-200 libnl-nf-3-dev \
                       libnl-cli-3-200 libnl-cli-3-dev \
                       libswsscommon libswsscommon-dev \
                       libsairedis libsairedis-dev libsaimetadata libsaimetadata-dev \
                       libsaivs libsaivs-dev libdashapi \
                       libteam5 libteamdctl0 libteam-dev libteam-utils stp; do
              tgz=$(ls "$CACHE_DIR"/${pkg}_*.tgz 2>/dev/null | sort -V | tail -1)
              if [ -n "$tgz" ]; then
                tar xzf "$tgz" -C "$EXTRACT_DIR" || echo "::warning::failed to extract $tgz"
              fi
            done

            # Move any .deb files found to top level
            find "$EXTRACT_DIR" -name '*.deb' -exec mv {} "$EXTRACT_DIR/" \; 2>&1 || echo "::warning::some .deb moves failed"

            if ls "$EXTRACT_DIR"/libswsscommon-dev_*.deb 1>/dev/null 2>&1; then
              echo "debs_dir=$EXTRACT_DIR" >> "$GITHUB_OUTPUT"
              echo "Extracted debs from cache to: $EXTRACT_DIR"
              ls "$EXTRACT_DIR"/*.deb | wc -l | xargs -I{} echo "  {} .deb files extracted"
              exit 0
            fi
          fi

          echo "::error::No SONiC dependency debs found on this runner."
          echo "  Checked: /var/cache/sonic/debs/bookworm, buildimage workspaces, dpkg cache tarballs."
          echo "  Ensure a sonic-buildimage CI run has completed on this runner."
          exit 1

      - name: Build SWSS + run mock tests
        env:
          DOCKER_IMG: ${{ steps.docker.outputs.image }}
          DEBS_DIR: ${{ steps.debs.outputs.debs_dir }}
          SKIP_DPKG: ${{ inputs.skip_dpkg }}
          SWSS_COMMON_REF: ${{ inputs.swss_common_ref }}
        run: |
          MOUNT_ARGS=()
          if [ -d "${{ github.workspace }}/sonic-swss-common" ]; then
            MOUNT_ARGS+=(-v "${{ github.workspace }}/sonic-swss-common:/build/sonic-swss-common")
          fi

          docker run --rm --privileged --init \
            --ulimit nofile=65536:65536 \
            -v "${{ github.workspace }}:/build/sonic-swss" \
            -v "${DEBS_DIR}:/debs:ro" \
            "${MOUNT_ARGS[@]}" \
            -w "/build/sonic-swss" \
            -e CARGO_NET_GIT_FETCH_WITH_CLI=true \
            -e SKIP_DPKG="${SKIP_DPKG}" \
            -e SWSS_COMMON_REF="${SWSS_COMMON_REF}" \
            "${DOCKER_IMG}" \
            bash -c '
          set -eo pipefail

          # ── Phase 1: Install SONiC build dependencies (quiet) ──
          cd /debs

          dep_warnings=0
          install_deb() {
            local pattern="$1"
            local deb=$(ls ${pattern} 2>/dev/null | sort -V | tail -1)
            if [ -n "$deb" ]; then
              if ! sudo dpkg --force-depends --force-overwrite -i "$deb" >/dev/null 2>&1; then
                echo "::warning::dpkg install issue: $deb"
                dep_warnings=$((dep_warnings + 1))
              fi
            else
              echo "::warning::no .deb match for pattern: $pattern"
              dep_warnings=$((dep_warnings + 1))
            fi
          }

          echo "=== Installing SONiC dependencies (27 packages) ==="
          for pkg in \
            "libyang_*.deb" "libyang-cpp_*.deb" "libyang-dev_*.deb" \
            "libnl-3-200_*.deb" "libnl-3-dev_*.deb" \
            "libnl-route-3-200_*.deb" "libnl-route-3-dev_*.deb" \
            "libnl-genl-3-200_*.deb" "libnl-genl-3-dev_*.deb" \
            "libnl-nf-3-200_*.deb" "libnl-nf-3-dev_*.deb" \
            "libnl-cli-3-200_*.deb" "libnl-cli-3-dev_*.deb" \
            "libswsscommon_*.deb" "libswsscommon-dev_*.deb" \
            "libsairedis_*.deb" "libsairedis-dev_*.deb" \
            "libsaimetadata_*.deb" "libsaimetadata-dev_*.deb" \
            "libsaivs_*.deb" "libsaivs-dev_*.deb" \
            "libdashapi_*.deb" \
            "libteam5_*.deb" "libteamdctl0_*.deb" "libteam-dev_*.deb" "libteam-utils_*.deb" \
            "stp_*.deb"; do
            install_deb "$pkg"
          done
          sudo ldconfig
          if [ "$dep_warnings" -gt 0 ]; then
            echo "::warning::$dep_warnings package(s) had install issues (see above)"
          else
            echo "OK: all 27 packages installed"
          fi

          echo "=== Verify key headers ==="
          for hdr in /usr/include/swss/logger.h /usr/include/sai/sai.h /usr/include/dash_api/appliance.pb.h; do
            test -f "$hdr" || { echo "FAIL: missing $hdr"; exit 1; }
          done
          echo "OK: all key headers present"

          # ── Phase 1b: Build sonic-swss-common from source (if provided) ──
          if [ -d "/build/sonic-swss-common" ] && [ -n "${SWSS_COMMON_REF}" ]; then
            echo "=== Building sonic-swss-common from source (ref: ${SWSS_COMMON_REF}) ==="
            cd /build/sonic-swss-common
            SECONDS=0
            ./autogen.sh >/dev/null 2>&1
            ./configure --prefix=/usr --disable-yangmodules >/dev/null 2>&1 \
              || { echo "FAIL: swss-common configure failed"; ./configure --prefix=/usr --disable-yangmodules; exit 1; }
            make -j$(nproc) V=0

            # Targeted install: only headers + shared lib + pkg-config.
            # Skips full "make install" which does expensive libtool re-linking
            # of SWIG Python extensions (~24 min) that swss does not need.
            echo "=== Installing swss-common (targeted) ==="
            sudo install -d /usr/lib /usr/include/swss /usr/lib/pkgconfig

            # Shared libraries (from libtool build directory)
            sudo cp -a common/.libs/libswsscommon.so* /usr/lib/
            sudo cp -a common/.libs/libswsscommon.la /usr/lib/ 2>/dev/null || true
            sudo cp -a sonic-db-cli/.libs/libsonicdbcli.so* /usr/lib/ 2>/dev/null || true
            sudo ldconfig

            # pkg-config files
            for pc in common/*.pc sonic-db-cli/*.pc; do
              [ -f "$pc" ] && sudo cp "$pc" /usr/lib/pkgconfig/
            done

            # Headers: preserve cfg_schema.h from cached deb -- it contains all
            # CFG_*_TABLE_NAME macros generated from YANG models. The source build
            # with --disable-yangmodules produces only a minimal stub.
            if [ -f /usr/include/swss/cfg_schema.h ]; then
              cp /usr/include/swss/cfg_schema.h /tmp/cfg_schema.h.preserved
            fi
            sudo cp common/*.h /usr/include/swss/
            if [ -f /tmp/cfg_schema.h.preserved ]; then
              sudo cp /tmp/cfg_schema.h.preserved /usr/include/swss/cfg_schema.h
              echo "  Restored cfg_schema.h from cached deb (yang-generated)"
            fi
            echo "  $(ls common/*.h | wc -l) source headers synced to /usr/include/swss/"
            echo "=== sonic-swss-common installed from source (${SECONDS}s) ==="
            cd /build/sonic-swss
          fi

          # ── Phase 2: Configure (coverage for diff-cover) ──
          cd /build/sonic-swss
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq lcov >/dev/null 2>&1 || true
          ./autogen.sh >/dev/null 2>&1
          ./configure CFLAGS="--coverage -O0 -g" CXXFLAGS="--coverage -O0 -g" LDFLAGS="--coverage" \
            >/dev/null 2>&1 || { echo "FAIL: configure failed"; ./configure \
            CFLAGS="--coverage -O0 -g" CXXFLAGS="--coverage -O0 -g" LDFLAGS="--coverage"; exit 1; }

          # ── Phase 3: Build ──
          echo "=== Phase 3: make (V=0, -j$(nproc)) ==="
          SECONDS=0
          make V=0 -j$(nproc)
          echo "=== make SUCCEEDED (${SECONDS}s) ==="

          # ── Phase 4: Run mock tests ──
          echo "=== Phase 4: mock tests ==="
          SECONDS=0
          make check V=0 -j$(nproc) 2>&1 || {
            echo "=== Mock test failures ==="
            cat tests/mock_tests/test-suite.log 2>/dev/null || true
            cat tests/mock_tests/tests.log 2>/dev/null || true
            exit 1
          }
          echo "=== Mock tests PASSED (${SECONDS}s) ==="

          echo "=== lcov (mock tests) ==="
          lcov --directory . --capture --output-file lcov.info --rc lcov_branch_coverage=0 \
            || { echo "::error::lcov capture failed"; exit 1; }
          lcov --remove lcov.info '/usr/*' '*/tests/*' '*/googletest/*' \
            --output-file lcov.filtered.info --ignore-errors unused \
            || cp lcov.info lcov.filtered.info
          cp lcov.filtered.info /build/sonic-swss/lcov.filtered.info 2>/dev/null || :

          # ── Phase 5: Rust countersyncd build ──
          echo "=== Phase 5: Rust build ==="
          SECONDS=0
          if ! cargo build --release --locked > /tmp/cargo.log 2>&1; then
            cat /tmp/cargo.log
            echo "=== Rust build FAILED ==="
            exit 1
          fi
          tail -3 /tmp/cargo.log
          echo "=== Rust build SUCCEEDED (${SECONDS}s) ==="

          # ── Phase 6: dpkg-buildpackage (optional) ──
          sudo chmod 1777 ..
          if [ "${SKIP_DPKG}" = "true" ]; then
            echo "=== Skipping dpkg-buildpackage (SKIP_DPKG=true) ==="
          else
            echo "=== Phase 6: dpkg-buildpackage ==="
            SECONDS=0
            if ! DEB_BUILD_OPTIONS="nocheck" dpkg-buildpackage -us -uc -b -j$(nproc) -d > /tmp/dpkg.log 2>&1; then
              tail -50 /tmp/dpkg.log
              echo "=== dpkg-buildpackage FAILED ==="
              exit 1
            fi
            tail -5 /tmp/dpkg.log
            echo "=== dpkg-buildpackage SUCCEEDED (${SECONDS}s) ==="
            ls -la ../swss_*.deb ../swss-dbg_*.deb 2>/dev/null || true
            cp ../swss_*.deb ../swss-dbg_*.deb /build/sonic-swss/ 2>/dev/null || true
          fi

          echo "=== ALL PHASES COMPLETE ==="
          '

      - name: Diff-cover on changed lines (≥80%)
        if: success()
        run: |
          set -euo pipefail
          if [ ! -f lcov.filtered.info ]; then
            echo "lcov.filtered.info missing" | tee diff-cover.log
            exit 1
          fi
          python3 -m pip install --user 'diff-cover>=9.0.0'
          export PATH="${HOME}/.local/bin:${PATH}"
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            COMPARE="${{ github.event.pull_request.base.sha }}"
            git fetch --no-tags origin "${COMPARE}"
          else
            git fetch --no-tags --depth=1 origin upscaleai-202511
            COMPARE="origin/upscaleai-202511"
          fi
          diff-cover lcov.filtered.info --compare-branch "${COMPARE}" \
            --format markdown:diff-cover.md || true
          set +e
          COVERAGE_FAIL_UNDER="${{ vars.COVERAGE_FAIL_UNDER || '80' }}"
          diff-cover lcov.filtered.info --compare-branch "${COMPARE}" \
            --fail-under "${COVERAGE_FAIL_UNDER}" 2>&1 | tee diff-cover.log
          exit ${PIPESTATUS[0]}

      - name: Upload coverage artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: swss-coverage-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            lcov.filtered.info
            diff-cover.md
            diff-cover.log
          if-no-files-found: ignore

      - name: Upload .deb artifacts
        if: inputs.skip_dpkg != true && always()
        uses: actions/upload-artifact@v4
        with:
          name: swss-debs-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            swss_*.deb
            swss-dbg_*.deb
          retention-days: 30
          if-no-files-found: warn

      - name: Build summary
        if: always()
        env:
          BRANCH_NAME: ${{ github.head_ref || github.ref_name }}
          COMMIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          DOCKER_IMAGE_USED: ${{ steps.docker.outputs.image }}
          DEBS_SOURCE: ${{ steps.debs.outputs.debs_dir }}
          SKIP_DPKG_VAL: ${{ inputs.skip_dpkg }}
        run: |
          echo "## SWSS Gating Build Summary" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Property | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "| --- | --- |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Branch | \`${BRANCH_NAME}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Commit | \`${COMMIT_SHA}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Docker image | \`${DOCKER_IMAGE_USED}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Debs source | \`${DEBS_SOURCE}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Skip dpkg | \`${SKIP_DPKG_VAL}\` |" >> "$GITHUB_STEP_SUMMARY"
