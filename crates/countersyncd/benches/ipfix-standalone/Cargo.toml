[package]
name = "countersyncd-ipfix-bench"
version = "0.1.0"
edition = "2021"
publish = false

# Import the real IPFIX/message/reporter sources without SONiC native libraries.
[workspace]

[dependencies]
ahash = "0.8.11"
byteorder = "1.5"
chrono = "0.4"
libc = "0.2"
log = "0.4"
once_cell = "1"
tokio = { version = "1.37", features = ["rt", "rt-multi-thread", "sync", "time", "macros"] }
mimalloc = { version = "0.1", default-features = false, optional = true }

[dev-dependencies]
tokio = { version = "1.37", features = ["test-util"] }

[features]
baseline-legacy = []
mimalloc = ["dep:mimalloc"]
