parameters:
- name: repo
  type: string
  default: self

- name: arch
  type: string
  values: [amd64]
  default: amd64

- name: timeout
  type: number
  default: 60

- name: swss_artifact_name
  type: string

- name: sairedis_artifact_name
  type: string

- name: sairedis_current_run
  type: boolean
  default: false

- name: swss_common_artifact_name
  type: string

- name: swss_common_current_run
  type: boolean
  default: false

- name: artifact_name
  type: string

- name: debian_version
  type: string
  default: bookworm

- name: vpp_artifact_name
  type: string
  default: vpp-bookworm

- name: buildimage_artifact_name
  type: string
  default: sonic-buildimage.vs

- name: buildimage_artifact_project
  type: string
  default: build

- name: buildimage_artifact_pipeline
  type: string
  default: Azure.sonic-buildimage.official.vs

- name: buildimage_artifact_branch
  type: string
  default: '$(BUILD_BRANCH)'

- name: debug_pkg
  type: string
  default: swss-dbg

- name: include_gcov
  type: boolean
  default: true

- name: include_vpp
  type: boolean
  default: true

- name: include_nexthopgroup
  type: boolean
  default: false

- name: asan
  type: boolean
  default: false

jobs:
- job:
  displayName: ${{ parameters.arch }}
  timeoutInMinutes: ${{ parameters.timeout }}

  pool:
    vmImage: 'ubuntu-22.04'

  steps:
  - checkout: ${{ parameters.repo }}
    clean: true

  - ${{ if eq(parameters.repo, 'self') }}:
    - template: merge-target-branch.yml

  - ${{ if eq(parameters.swss_common_current_run, true) }}:
    - task: DownloadPipelineArtifact@2
      inputs:
        artifact: ${{ parameters.swss_common_artifact_name }}
        path: $(Build.ArtifactStagingDirectory)/download
      displayName: "Download current-run ${{ parameters.swss_common_artifact_name }}"
  - ${{ else }}:
    - task: DownloadPipelineArtifact@2
      inputs:
        source: specific
        project: build
        pipeline: Azure.sonic-swss-common
        artifact: ${{ parameters.swss_common_artifact_name }}
        runVersion: latestFromBranch
        runBranch: refs/heads/$(BUILD_BRANCH)
        allowPartiallySucceededBuilds: true
        path: $(Build.ArtifactStagingDirectory)/download
      displayName: "Download sonic-swss-common artifacts"

  - ${{ if eq(parameters.sairedis_current_run, true) }}:
    - task: DownloadPipelineArtifact@2
      inputs:
        artifact: ${{ parameters.sairedis_artifact_name }}
        path: $(Build.ArtifactStagingDirectory)/download/sairedis
      displayName: "Download current-run ${{ parameters.sairedis_artifact_name }}"
  - ${{ else }}:
    - task: DownloadPipelineArtifact@2
      inputs:
        source: specific
        project: build
        pipeline: Azure.sonic-sairedis
        artifact: ${{ parameters.sairedis_artifact_name }}
        runVersion: latestFromBranch
        runBranch: refs/heads/$(BUILD_BRANCH)
        allowPartiallySucceededBuilds: true
        path: $(Build.ArtifactStagingDirectory)/download/sairedis
        patterns: |
          **/libsaivs_*.deb
          **/libsaivs-dev_*.deb
          **/libsairedis_*.deb
          **/libsairedis-dev_*.deb
          **/libsaimetadata_*.deb
          **/libsaimetadata-dev_*.deb
          **/syncd-vs_*.deb
      displayName: "Download sonic-sairedis artifacts"

  # The swss artifact is always produced earlier in the current consumer run.
  - task: DownloadPipelineArtifact@2
    inputs:
      artifact: ${{ parameters.swss_artifact_name }}
      path: $(Build.ArtifactStagingDirectory)/download
    displayName: "Download current-run ${{ parameters.swss_artifact_name }}"

  - task: DownloadPipelineArtifact@2
    inputs:
      source: specific
      project: build
      pipeline: sonic-net.sonic-dash-api
      ${{ if eq(parameters.arch, 'amd64') }}:
        artifact: sonic-dash-api
      ${{ else }}:
        artifact: sonic-dash-api.${{ parameters.arch }}
      runVersion: latestFromBranch
      runBranch: refs/heads/$(BUILD_BRANCH)
      path: $(Build.ArtifactStagingDirectory)/download
      patterns: |
        libdashapi*.deb
    displayName: "Download dash-api"

  - task: DownloadPipelineArtifact@2
    inputs:
      source: specific
      project: ${{ parameters.buildimage_artifact_project }}
      pipeline: ${{ parameters.buildimage_artifact_pipeline }}
      artifact: ${{ parameters.buildimage_artifact_name }}
      runVersion: latestFromBranch
      runBranch: refs/heads/${{ parameters.buildimage_artifact_branch }}
      path: $(Build.ArtifactStagingDirectory)/download
      patterns: |
        **/target/${{ parameters.artifact_name }}.gz
        **/target/debs/${{ parameters.debian_version }}/framework_*.deb
    displayName: "Download base ${{ parameters.artifact_name }} image"

  - ${{ if eq(parameters.include_vpp, true) }}:
    - task: DownloadPipelineArtifact@2
      inputs:
        source: specific
        project: build
        pipeline: sonic-net.sonic-platform-vpp
        artifact: ${{ parameters.vpp_artifact_name }}
        runVersion: latestFromBranch
        runBranch: refs/heads/master
        allowPartiallySucceededBuilds: true
        path: $(Build.ArtifactStagingDirectory)/download
      displayName: "Download VPP artifacts"

  - ${{ if eq(parameters.include_nexthopgroup, true) }}:
    - task: DownloadPipelineArtifact@2
      inputs:
        source: specific
        project: build
        pipeline: Azure.sonic-buildimage.common_libs
        artifact: common-lib
        runVersion: latestFromBranch
        runBranch: refs/heads/$(BUILD_BRANCH)
        path: $(Build.ArtifactStagingDirectory)/download
        patterns: '**/target/debs/*/libnexthopgroup_*.deb'
      displayName: "Download libnexthopgroup"

  - script: |
      set -ex
      echo $(Build.DefinitionName).$(Build.BuildNumber)

      docker load < $(Build.ArtifactStagingDirectory)/download/target/${{ parameters.artifact_name }}.gz

      rm -rf .azure-pipelines/docker-sonic-vs/debs
      mkdir -p .azure-pipelines/docker-sonic-vs/debs
      find $(Build.ArtifactStagingDirectory)/download/sairedis -name '*.deb' -exec cp -v "{}" .azure-pipelines/docker-sonic-vs/debs \;
      find $(Build.ArtifactStagingDirectory)/download -maxdepth 1 -name '*.deb' -exec cp -v "{}" .azure-pipelines/docker-sonic-vs/debs \;
      find $(Build.ArtifactStagingDirectory)/download -name 'libnexthopgroup_*.deb' -exec cp -v "{}" .azure-pipelines/docker-sonic-vs/debs \;

      if [ '${{ parameters.include_gcov }}' == True ] && [ -f $(Build.ArtifactStagingDirectory)/download/coverage.info ]; then
        cp -v $(Build.ArtifactStagingDirectory)/download/coverage.info $(Build.ArtifactStagingDirectory)/
        cp -v $(Build.ArtifactStagingDirectory)/download/coverage.xml $(Build.ArtifactStagingDirectory)/
      fi

      build_dir=""
      if [ '${{ parameters.include_gcov }}' == True ] && [ -f $(Build.ArtifactStagingDirectory)/download/build.info ]; then
        build_dir=$(grep BUILD_DIR $(Build.ArtifactStagingDirectory)/download/build.info | cut -d= -f2)
      fi

      build_args="--build-arg build_dir=$build_dir"
      build_args="$build_args --build-arg debug_pkg=${{ parameters.debug_pkg }}"
      build_args="$build_args --build-arg include_gcov=$([ '${{ parameters.include_gcov }}' == True ] && echo y || echo n)"
      build_args="$build_args --build-arg include_vpp=$([ '${{ parameters.include_vpp }}' == True ] && echo y || echo n)"
      build_args="$build_args --build-arg include_nexthopgroup=$([ '${{ parameters.include_nexthopgroup }}' == True ] && echo y || echo n)"
      if [ '${{ parameters.asan }}' == True ]; then
        build_args="$build_args --build-arg need_dbg=y"
      fi

      pushd .azure-pipelines
      docker build $build_args --no-cache \
        -t docker-sonic-vs:$(Build.DefinitionName).$(Build.BuildNumber).asan-${{ parameters.asan }} \
        docker-sonic-vs
      popd

      docker save docker-sonic-vs:$(Build.DefinitionName).$(Build.BuildNumber).asan-${{ parameters.asan }} \
        | gzip -c > $(Build.ArtifactStagingDirectory)/docker-sonic-vs.gz
      rm -rf $(Build.ArtifactStagingDirectory)/download
      rm -rf .azure-pipelines/docker-sonic-vs/debs
    displayName: "Build ${{ parameters.artifact_name }}"

  - publish: $(Build.ArtifactStagingDirectory)/
    artifact: ${{ parameters.artifact_name }}
    displayName: "Archive sonic docker VS image"
